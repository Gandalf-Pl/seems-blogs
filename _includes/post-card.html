<a class="post-card" href="{{ include.post.url | relative_url }}">
  <h3>{{ include.post.title | escape }}</h3>
  <div class="card-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y-%m-%d' }}</time><span>{{ include.post.categories | first | default: 'AI 观察' | escape }}</span><span class="card-arrow" aria-hidden="true">↗</span></div>
</a>
