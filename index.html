---
layout: default
---

<div class="home">
    <div class="terminal-box">
        <div class="terminal-header">
            <span class="terminal-btn red"></span>
            <span class="terminal-btn yellow"></span>
            <span class="terminal-btn green"></span>
            <span class="terminal-title">blog.sh — 80×24</span>
        </div>
        <div class="terminal-body">
            <div class="line">
                <span class="prompt">$</span> <span class="command">cat welcome.txt</span>
            </div>
            <div class="line output">
                {{ site.description }}
            </div>            
            <div class="line">
                <span class="prompt">$</span> <span class="command">ls -la posts/</span>
            </div>
            
            {%- for post in site.posts -%}
            <div class="line post-item">
                <span class="date">{{ post.date | date: "%b %d" }}</span>
                <a href="{{ post.url | relative_url }}" class="post-link">{{ post.title }}</a>
            </div>
            {%- endfor -%}
            
            <div class="line">
                <span class="prompt">$</span> <span class="cursor">█</span>
            </div>
        </div>
    </div>
</div>
