<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    
    <div class="container">
        <header class="site-header">
            <h1 class="site-title">
                <a href="{{ '/' | relative_url }}" class="glitch" data-text="{{ site.title }}">{{ site.title }}</a>
            </h1>
            <nav class="site-nav">
                <a href="{{ '/' | relative_url }}">首页</a>
                <a href="{{ '/about' | relative_url }}">关于</a>
            </nav>
        </header>

        <main class="page-content">
            {{ content }}
        </main>

        <footer class="site-footer">
            <p><span class="prompt">$</span> echo "© {{ 'now' | date: '%Y' }} {{ site.title }}"</p>
        </footer>
    </div>

    <script src="{{ '/assets/js/particles.js' | relative_url }}"></script>
</body>
</html>
