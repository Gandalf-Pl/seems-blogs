<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <meta name="theme-color" content="#0b1014">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到正文</a>
  {% if page.url == '/' %}<canvas id="particle-canvas" aria-hidden="true"></canvas>{% endif %}
  <div class="container">
    <header class="site-header">
      <div class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/about' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>关于</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
      </nav>
    </header>
    <main class="page-content" id="main-content" tabindex="-1">{{ content }}</main>
    <footer class="site-footer"><p>© {{ 'now' | date: '%Y' }} {{ site.title }} · 记录、实践、思考</p><a href="https://github.com/Gandalf-Pl">GitHub ↗</a></footer>
  </div>
  {% if page.url == '/' %}<script src="{{ '/assets/js/particles.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
