<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO 优化 -->
    {% seo %}
    <!-- 自定义标题（SEO插件会处理，但保留备用） -->
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <!-- 关键词（如果页面有定义） -->
    {% if page.keywords %}
    <meta name="keywords" content="{{ page.keywords | join: ',' }}">
    {% else %}
    <meta name="keywords" content="{{ site.keywords | join: ',' }}">
    {% endif %}
    
    <!-- 作者 -->
    <meta name="author" content="{% if page.author %}{{ page.author }}{% else %}{{ site.author.name }}{% endif %}">
    
    <!-- 样式 -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    
    <div class="container">
        <header class="site-header">
            <h1 class="site-title">
                <a href="{{ '/' | relative_url }}" class="glitch" data-text="{{ site.title }}">{{ site.title }}</a>
            </h1>
            <nav class="site-nav">
                <a href="{{ '/' | relative_url }}">首页</a>
                <a href="{{ '/about' | relative_url }}">关于</a>
            </nav>
        </header>

        <main class="page-content">
            {{ content }}
        </main>

        <footer class="site-footer">
            <p><span class="prompt">$</span> echo "© {{ 'now' | date: '%Y' }} {{ site.title }}"</p>
        </footer>
    </div>

    <script src="{{ '/assets/js/particles.js' | relative_url }}"></script>
</body>
</html>
