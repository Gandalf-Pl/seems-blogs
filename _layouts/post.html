---
layout: default
---

<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
            <span class="date"><span class="prompt">$</span> date: {{ page.date | date: "%Y-%m-%d %H:%M:%S" }}</span>
        </div>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
