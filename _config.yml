# Site Configuration
title: 我的博客
description: 一个基于 Jekyll 的个人博客
url: "https://gandalf-pl.github.io"
baseurl: "/seems-blogs"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore

# Theme settings
show_excerpts: true

# Author
author:
  name: 博主
  email: blog@example.com
