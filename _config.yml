# Site Configuration
title: 我的博客
description: 一个基于 Jekyll 的个人博客
url: "https://gandalf-pl.github.io"
baseurl: "/seems-blogs"

# Theme - GitHub Pages 支持的主题
theme: minima

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Minima 主题设置
minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/Gandalf-Pl" }

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - _tabs

# Author
author:
  name: 博主
  email: blog@example.com
